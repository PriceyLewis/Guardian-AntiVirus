[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-antivirus"
version = "1.1.0"
description = "Linux desktop malware scanner and folder monitor built on ClamAV, PySide6 and SQLite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lewis Price" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.8,<7",
    "pyClamd==0.4.0",
    "watchdog>=6,<7",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Security",
]

[project.urls]
Source = "https://github.com/PriceyLewis/Guardian-AntiVirus"
Demo = "https://priceylewis.github.io/Guardian-AntiVirus/"

[project.scripts]
guardian = "guardian:main"

[tool.setuptools]
py-modules = ["guardian", "config"]
packages = ["core", "database", "ui", "assets"]

[tool.setuptools.package-data]
assets = ["icons/*.png", "themes/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
