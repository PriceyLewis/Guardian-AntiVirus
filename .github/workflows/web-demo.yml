name: Interactive Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guardian-web-demo
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Run native Python regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Prepare static demo
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R web-demo/. dist/
          touch dist/.nojekyll

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify recruiter demo journeys
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/guardian-demo.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

            await page.getByText('Interactive portfolio demo', { exact: true }).waitFor();
            await page.getByRole('button', { name: 'Add suspicious sample' }).click();

            let state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 1 || state.quarantine !== 1 || state.history !== 1) {
              throw new Error('Real-time protection journey failed: ' + JSON.stringify(state));
            }

            await page.getByRole('button', { name: /Quarantine/ }).click();
            await page.getByRole('button', { name: 'Restore' }).click();

            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.quarantine !== 0) {
              throw new Error('Restore journey failed: ' + JSON.stringify(state));
            }

            await page.getByRole('button', { name: 'Settings' }).click();
            const realtime = page.locator('[data-setting="realtime"]');
            await realtime.uncheck();
            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('button', { name: 'Settings' }).click();
            if (await page.locator('[data-setting="realtime"]').isChecked()) {
              throw new Error('Settings persistence failed');
            }

            await page.locator('[data-setting="realtime"]').check();
            await page.getByRole('button', { name: 'Overview' }).click();
            await page.locator('.scan-option[data-scan="quick"]').click();
            await page.waitForFunction(
              () => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().filesProcessed >= 8,
              null,
              { timeout: 15000 }
            );

            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.filesProcessed !== 8 || state.detections !== 1 || state.quarantine !== 1) {
              throw new Error('Quick scan journey failed: ' + JSON.stringify(state));
            }

            // A quarantined file must be absent from the virtual filesystem on the next scan.
            await page.locator('.scan-option[data-scan="quick"]').click();
            await page.waitForFunction(
              () => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().filesProcessed >= 15,
              null,
              { timeout: 15000 }
            );
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 1 || state.quarantine !== 1) {
              throw new Error('Quarantined sample was detected twice: ' + JSON.stringify(state));
            }

            // Restoring puts the virtual file back, so the next scan should detect it again.
            await page.getByRole('button', { name: /Quarantine/ }).click();
            await page.getByRole('button', { name: 'Restore' }).click();
            await page.getByRole('button', { name: 'Overview' }).click();
            await page.locator('.scan-option[data-scan="quick"]').click();
            await page.waitForFunction(
              () => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().detections === 2,
              null,
              { timeout: 15000 }
            );
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.quarantine !== 1 || state.detections !== 2) {
              throw new Error('Restored sample was not re-detected correctly: ' + JSON.stringify(state));
            }

            // New samples remain in the virtual filesystem after restore and
            // when monitoring is off; each can be found by a later manual scan.
            await page.getByRole('button', { name: 'Add suspicious sample' }).click();
            await page.getByRole('button', { name: /Quarantine/ }).click();
            await page.getByRole('row').filter({ hasText: 'new_suspicious_sample_1.exe' }).getByRole('button', { name: 'Restore', exact: true }).click();
            await page.getByRole('button', { name: 'Quick Scan', exact: true }).click();
            await page.waitForFunction(() => !window.__guardianDemo.getState().scanning);
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 4 || state.quarantine !== 2) throw new Error('Restored dynamic sample was lost: ' + JSON.stringify(state));
            await page.getByRole('button', { name: 'Settings' }).click();
            await page.locator('[data-setting="realtime"]').uncheck();
            await page.getByRole('button', { name: 'Overview', exact: true }).click();
            await page.getByRole('button', { name: 'Add suspicious sample' }).click();
            await page.getByRole('button', { name: 'Quick Scan', exact: true }).click();
            await page.waitForFunction(() => !window.__guardianDemo.getState().scanning);
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 5 || state.quarantine !== 3) throw new Error('Unmonitored sample was lost: ' + JSON.stringify(state));
            await page.getByRole('button', { name: 'History', exact: true }).click();
            await page.getByRole('searchbox', { name: 'Search history' }).fill('new_suspicious_sample_2.exe');
            const downloadPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: 'Export CSV' }).click();
            const download = await downloadPromise;
            const csv = require('fs').readFileSync(await download.path(), 'utf8');
            if (!csv.includes('new_suspicious_sample_2.exe') || csv.includes('coursework-notes.pdf')) throw new Error('CSV ignored the current filter');

            await page.screenshot({ path: 'guardian-web-demo.png', fullPage: true });
            console.log('Guardian demo verified:', state);

            // Mobile visual regression: quarantine actions must remain on-screen and the page must not overflow.
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const mobileErrors = [];
            mobile.on('pageerror', error => mobileErrors.push(error.message));
            await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await mobile.getByRole('button', { name: 'Add suspicious sample' }).click();
            await mobile.getByRole('button', { name: /Quarantine/ }).click();
            await mobile.getByRole('button', { name: 'Restore' }).waitFor();
            if (await mobile.locator('#toast-region .toast').count()) {
              throw new Error('Stale Guardian toast remained after page navigation');
            }

            const mobileLayout = await mobile.evaluate(() => ({
              viewport: innerWidth,
              documentWidth: document.documentElement.scrollWidth,
              restore: (() => {
                const el = [...document.querySelectorAll('button')].find(button => button.textContent?.trim() === 'Restore');
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { left: r.left, right: r.right, width: r.width };
              })(),
              deleteButton: (() => {
                const el = [...document.querySelectorAll('button')].find(button => button.textContent?.trim() === 'Delete');
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { left: r.left, right: r.right, width: r.width };
              })(),
            }));

            if (mobileErrors.length) {
              throw new Error('Guardian mobile page errors: ' + mobileErrors.join(' | '));
            }
            if (mobileLayout.documentWidth > mobileLayout.viewport + 2) {
              throw new Error('Guardian mobile horizontal overflow: ' + JSON.stringify(mobileLayout));
            }
            for (const [name, rect] of [['Restore', mobileLayout.restore], ['Delete', mobileLayout.deleteButton]]) {
              if (!rect || rect.left < -1 || rect.right > mobileLayout.viewport + 1 || rect.width < 40) {
                throw new Error(name + ' action is not usable on mobile: ' + JSON.stringify(mobileLayout));
              }
            }

            await mobile.screenshot({ path: 'guardian-web-demo-mobile.png', fullPage: true });
            await mobile.getByRole('button', { name: 'History', exact: true }).click();
            await mobile.getByRole('searchbox', { name: 'Search history' }).fill('sample');
            await mobile.setViewportSize({ width: 320, height: 740 });
            const historyWidth = await mobile.evaluate(() => ({ width: innerWidth, content: document.documentElement.scrollWidth }));
            await mobile.screenshot({ path: 'guardian-history-mobile.png', fullPage: true });
            if (historyWidth.content > historyWidth.width + 2) throw new Error('History toolbar overflows mobile: ' + JSON.stringify(historyWidth));
            await mobile.close();

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guardian-interactive-demo
          path: |
            guardian-web-demo.png
            guardian-web-demo-mobile.png
            guardian-history-mobile.png
          if-no-files-found: warn
          retention-days: 7

      - name: Publish gh-pages branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy Guardian interactive demo from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
