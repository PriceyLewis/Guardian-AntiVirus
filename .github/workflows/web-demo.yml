name: Interactive Web Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with the Flatpak repository publisher, which writes to the same gh-pages branch.
concurrency:
  group: guardian-pages
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Qt runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0

      - name: Run native Python regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q

      - name: Prepare static demo
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R web-demo/. dist/
          touch dist/.nojekyll

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify recruiter demo journeys
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/guardian-demo.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

            await page.getByText('Interactive portfolio demo', { exact: true }).waitFor();
            await page.getByRole('button', { name: 'Add suspicious sample' }).click();

            let state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 1 || state.quarantine !== 1 || state.history !== 1) {
              throw new Error('Real-time protection journey failed: ' + JSON.stringify(state));
            }

            await page.getByRole('button', { name: /Quarantine/ }).click();
            await page.getByRole('button', { name: 'Restore' }).click();

            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.quarantine !== 0) {
              throw new Error('Restore journey failed: ' + JSON.stringify(state));
            }

            await page.getByRole('button', { name: 'Settings' }).click();
            const realtime = page.locator('[data-setting="realtime"]');
            await realtime.uncheck();
            await page.reload({ waitUntil: 'networkidle' });
            await page.getByRole('button', { name: 'Settings' }).click();
            if (await page.locator('[data-setting="realtime"]').isChecked()) {
              throw new Error('Settings persistence failed');
            }

            await page.locator('[data-setting="realtime"]').check();
            await page.getByRole('button', { name: 'Overview' }).click();
            await page.locator('.scan-option[data-scan="quick"]').click();
            await page.waitForFunction(
              () => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().filesProcessed >= 8,
              null,
              { timeout: 15000 }
            );

            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.filesProcessed !== 8 || state.detections !== 1 || state.quarantine !== 1) {
              throw new Error('Quick scan journey failed: ' + JSON.stringify(state));
            }

            // A quarantined file must be absent from the virtual filesystem on the next scan.
            await page.locator('.scan-option[data-scan="quick"]').click();
            await page.waitForFunction(
              () => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().filesProcessed >= 15,
              null,
              { timeout: 15000 }
            );
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 1 || state.quarantine !== 1) {
              throw new Error('Quarantined sample was detected twice: ' + JSON.stringify(state));
            }

            // Restoring puts the virtual file back, so the next scan should detect it again.
            await page.getByRole('button', { name: /Quarantine/ }).click();
            await page.getByRole('button', { name: 'Restore' }).click();
            await page.getByRole('button', { name: 'Overview' }).click();
            await page.locator('.scan-option[data-scan="quick"]').click();
            await page.waitForFunction(
              () => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().detections === 2,
              null,
              { timeout: 15000 }
            );
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.quarantine !== 1 || state.detections !== 2) {
              throw new Error('Restored sample was not re-detected correctly: ' + JSON.stringify(state));
            }

            // New samples remain in the virtual filesystem after restore and
            // when monitoring is off; each can be found by a later manual scan.
            await page.getByRole('button', { name: 'Add suspicious sample' }).click();
            await page.getByRole('button', { name: /Quarantine/ }).click();
            await page.getByRole('row').filter({ hasText: 'new_suspicious_sample_1.exe' }).getByRole('button', { name: 'Restore', exact: true }).click();
            await page.getByRole('button', { name: 'Quick Scan', exact: true }).click();
            await page.waitForFunction(() => !window.__guardianDemo.getState().scanning);
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 4 || state.quarantine !== 2) throw new Error('Restored dynamic sample was lost: ' + JSON.stringify(state));
            await page.getByRole('button', { name: 'Settings' }).click();
            await page.locator('[data-setting="realtime"]').uncheck();
            await page.getByRole('button', { name: 'Overview', exact: true }).click();
            await page.getByRole('button', { name: 'Add suspicious sample' }).click();
            await page.getByRole('button', { name: 'Quick Scan', exact: true }).click();
            await page.waitForFunction(() => !window.__guardianDemo.getState().scanning);
            state = await page.evaluate(() => window.__guardianDemo.getState());
            if (state.detections !== 5 || state.quarantine !== 3) throw new Error('Unmonitored sample was lost: ' + JSON.stringify(state));
            await page.getByRole('button', { name: 'History', exact: true }).click();
            await page.getByRole('searchbox', { name: 'Search history' }).fill('new_suspicious_sample_2.exe');
            const downloadPromise = page.waitForEvent('download');
            await page.getByRole('button', { name: 'Export CSV' }).click();
            const download = await downloadPromise;
            const csv = require('fs').readFileSync(await download.path(), 'utf8');
            if (!csv.includes('new_suspicious_sample_2.exe') || csv.includes('coursework-notes.pdf')) throw new Error('CSV ignored the current filter');

            await page.screenshot({ path: 'guardian-web-demo.png', fullPage: true });
            console.log('Guardian demo verified:', state);

            // Mobile visual regression: quarantine actions must remain on-screen and the page must not overflow.
            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const mobileErrors = [];
            mobile.on('pageerror', error => mobileErrors.push(error.message));
            await mobile.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await mobile.getByRole('button', { name: 'Add suspicious sample' }).click();
            await mobile.getByRole('button', { name: /Quarantine/ }).click();
            await mobile.getByRole('button', { name: 'Restore' }).waitFor();
            if (await mobile.locator('#toast-region .toast').count()) {
              throw new Error('Stale Guardian toast remained after page navigation');
            }

            const mobileLayout = await mobile.evaluate(() => ({
              viewport: innerWidth,
              documentWidth: document.documentElement.scrollWidth,
              restore: (() => {
                const el = [...document.querySelectorAll('button')].find(button => button.textContent?.trim() === 'Restore');
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { left: r.left, right: r.right, width: r.width };
              })(),
              deleteButton: (() => {
                const el = [...document.querySelectorAll('button')].find(button => button.textContent?.trim() === 'Delete');
                if (!el) return null;
                const r = el.getBoundingClientRect();
                return { left: r.left, right: r.right, width: r.width };
              })(),
            }));

            if (mobileErrors.length) {
              throw new Error('Guardian mobile page errors: ' + mobileErrors.join(' | '));
            }
            if (mobileLayout.documentWidth > mobileLayout.viewport + 2) {
              throw new Error('Guardian mobile horizontal overflow: ' + JSON.stringify(mobileLayout));
            }
            for (const [name, rect] of [['Restore', mobileLayout.restore], ['Delete', mobileLayout.deleteButton]]) {
              if (!rect || rect.left < -1 || rect.right > mobileLayout.viewport + 1 || rect.width < 40) {
                throw new Error(name + ' action is not usable on mobile: ' + JSON.stringify(mobileLayout));
              }
            }

            await mobile.screenshot({ path: 'guardian-web-demo-mobile.png', fullPage: true });
            await mobile.getByRole('button', { name: 'History', exact: true }).click();
            await mobile.getByRole('searchbox', { name: 'Search history' }).fill('sample');
            await mobile.setViewportSize({ width: 320, height: 740 });
            const historyWidth = await mobile.evaluate(() => ({ width: innerWidth, content: document.documentElement.scrollWidth }));
            await mobile.screenshot({ path: 'guardian-history-mobile.png', fullPage: true });
            if (historyWidth.content > historyWidth.width + 2) throw new Error('History toolbar overflows mobile: ' + JSON.stringify(historyWidth));
            await mobile.close();

            // Release 1.1 parity: pause, chosen files, folder lists, fingerprints, on-access steps and themes.
            const v11 = await browser.newPage({ viewport: { width: 1280, height: 900 }, colorScheme: 'dark' });
            const v11Errors = [];
            v11.on('pageerror', error => v11Errors.push(error.message));
            await v11.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await v11.evaluate(() => localStorage.clear());
            await v11.reload({ waitUntil: 'networkidle' });
            if (await v11.evaluate(() => document.documentElement.dataset.theme) !== 'dark') throw new Error('Demo did not follow a dark system theme');
            await v11.getByRole('button', { name: 'Pause monitoring for 1 hour' }).click();
            await v11.getByText(/Monitoring paused until/).waitFor();
            await v11.getByRole('button', { name: 'Add suspicious sample' }).click();
            let s11 = await v11.evaluate(() => window.__guardianDemo.getState());
            if (s11.quarantine !== 0 || !s11.paused) throw new Error('Paused monitoring still quarantined a sample: ' + JSON.stringify(s11));
            await v11.getByRole('button', { name: 'Resume monitoring' }).click();
            await v11.locator('.scan-option[data-scan="files"]').click();
            await v11.waitForFunction(() => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().filesProcessed === 2, null, { timeout: 15000 });
            if (!(await v11.locator('#last-scan-line').textContent()).startsWith('Last scan: Custom scan complete')) throw new Error('Last scan line not updated');
            await v11.getByRole('button', { name: /Quarantine/ }).click();
            if (!(await v11.locator('#quarantine-body td').nth(3).getAttribute('title')).startsWith('275a021bbfb6')) throw new Error('Quarantine fingerprint missing');
            if (!(await v11.locator('#quarantine-usage').textContent()).includes('1 file in quarantine')) throw new Error('Quarantine usage missing');
            const reportPromise = v11.waitForEvent('download');
            await v11.getByRole('button', { name: 'Export report' }).click();
            const report = require('fs').readFileSync(await (await reportPromise).path(), 'utf8');
            if (!report.includes('SHA-256') || !report.includes('275a021bbfb6')) throw new Error('Quarantine report incomplete');
            await v11.getByRole('button', { name: 'Settings' }).click();
            await v11.getByLabel('Folder to exclude').fill('/home/demo/Downloads');
            await v11.locator('#excluded-add').click();
            await v11.getByRole('button', { name: 'Remove /home/demo/Downloads' }).first().waitFor();
            await v11.getByRole('button', { name: 'Overview' }).click();
            const before = (await v11.evaluate(() => window.__guardianDemo.getState())).filesProcessed;
            await v11.locator('.scan-option[data-scan="quick"]').click();
            await v11.waitForFunction(() => !window.__guardianDemo.getState().scanning, null, { timeout: 15000 });
            s11 = await v11.evaluate(() => window.__guardianDemo.getState());
            if (s11.filesProcessed - before !== 4) throw new Error('Excluded Downloads files were scanned: ' + JSON.stringify(s11));
            await v11.getByRole('button', { name: 'Settings' }).click();
            await v11.getByRole('button', { name: 'Show setup steps' }).click();
            if (!(await v11.locator('#onaccess-steps').textContent()).includes('OnAccessPrevention yes')) throw new Error('On-access steps missing');
            await v11.getByLabel('Appearance').selectOption('light');
            if (await v11.evaluate(() => document.documentElement.dataset.theme) !== 'light') throw new Error('Light theme not applied');
            await v11.getByRole('button', { name: 'Overview' }).click();
            await v11.screenshot({ path: 'guardian-web-demo-light.png', fullPage: true });
            const v11Width = await v11.evaluate(() => ({ width: innerWidth, content: document.documentElement.scrollWidth }));
            if (v11Width.content > v11Width.width + 2) throw new Error('Demo overflows horizontally: ' + JSON.stringify(v11Width));
            if (v11Errors.length) throw new Error('Guardian 1.1 demo page errors: ' + v11Errors.join(' | '));
            await v11.setViewportSize({ width: 360, height: 780 });
            await v11.getByRole('button', { name: 'Settings' }).click();
            const settingsWidth = await v11.evaluate(() => ({ width: innerWidth, content: document.documentElement.scrollWidth }));
            if (settingsWidth.content > settingsWidth.width + 2) throw new Error('Settings overflow on mobile: ' + JSON.stringify(settingsWidth));
            await v11.screenshot({ path: 'guardian-settings-mobile.png', fullPage: true });
            await v11.close();

            // Release 1.2: pause, unchanged-file skip, Suspicious files, VirusTotal lookups and install instructions.
            const v12 = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            const v12Errors = [];
            v12.on('pageerror', error => v12Errors.push(error.message));
            await v12.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            await v12.evaluate(() => localStorage.clear());
            await v12.reload({ waitUntil: 'networkidle' });
            await v12.evaluate(() => { window.__opened = []; window.open = url => { window.__opened.push(url); return null; }; });
            const s12 = () => v12.evaluate(() => window.__guardianDemo.getState());
            await v12.locator('.scan-option[data-scan="home"]').click();
            await v12.waitForFunction(() => window.__guardianDemo.getState().filesProcessed >= 2, null, { timeout: 15000 });
            await v12.getByRole('button', { name: 'Pause scan' }).click();
            const heldAt = (await s12()).filesProcessed;
            await v12.waitForTimeout(1200);
            if ((await s12()).filesProcessed !== heldAt || !(await v12.locator('#scan-state').textContent()).endsWith('Paused')) throw new Error('Pausing did not hold the scan');
            await v12.getByRole('button', { name: 'Resume scan' }).click();
            await v12.waitForFunction(() => !window.__guardianDemo.getState().scanning, null, { timeout: 20000 });
            let r12 = await s12();
            if (r12.suspicious !== 1 || r12.detections !== 1 || r12.quarantine !== 1) throw new Error('Home scan verdicts wrong: ' + JSON.stringify(r12));
            if (!(await v12.locator('#scan-summary').textContent()).includes('Suspicious: 1 (see History)')) throw new Error('Suspicious count missing from summary');
            if (!(await v12.locator('#second-line').textContent()).includes('1 suspicious file to review')) throw new Error('Overview does not mention the suspicious file');
            await v12.getByRole('button', { name: 'Check detections on VirusTotal' }).click();
            if ((await v12.evaluate(() => window.__opened.length)) !== 2) throw new Error('Detection lookups not opened');
            await v12.locator('.scan-option[data-scan="home"]').click();
            await v12.waitForFunction(() => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().filesProcessed > 20, null, { timeout: 20000 });
            if (!(await v12.locator('#scan-summary').textContent()).includes('unchanged, not rechecked')) throw new Error('Unchanged files were rescanned');
            if ((await s12()).suspicious !== 1) throw new Error('A rescanned suspicious file was counted twice');
            await v12.getByRole('button', { name: 'History', exact: true }).click();
            await v12.getByLabel('Filter history').selectOption('suspicious');
            await v12.getByRole('button', { name: 'Ignore this file' }).first().click();
            r12 = await s12();
            if (r12.suspicious !== 0 || r12.ignored !== 1) throw new Error('Ignoring did not clear the suspicious file: ' + JSON.stringify(r12));
            await v12.getByRole('button', { name: 'Overview', exact: true }).click();
            await v12.locator('.scan-option[data-scan="home"]').click();
            await v12.waitForFunction(() => !window.__guardianDemo.getState().scanning && window.__guardianDemo.getState().filesProcessed > 30, null, { timeout: 20000 });
            if ((await s12()).suspicious !== 0) throw new Error('An ignored file was reported again');
            await v12.getByLabel('Link to look up').fill('example.com/download');
            await v12.getByRole('button', { name: 'Look up link' }).click();
            const linkUrl = await v12.evaluate(() => window.__opened.at(-1));
            if (linkUrl !== 'https://www.virustotal.com/gui/search/http%253A%252F%252Fexample.com%252Fdownload') throw new Error('Link lookup opened ' + linkUrl);
            await v12.locator('#lookup-file').setInputFiles({ name: 'hello.txt', mimeType: 'text/plain', buffer: Buffer.from('hello') });
            await v12.waitForFunction(() => window.__opened.at(-1).includes('/gui/file/'));
            const fileUrl = await v12.evaluate(() => window.__opened.at(-1));
            if (!fileUrl.endsWith('2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824')) throw new Error('File lookup fingerprint wrong: ' + fileUrl);
            if (!(await v12.getByText('install.sh | sh').count())) throw new Error('Install instructions missing');
            const v12Width = await v12.evaluate(() => ({ width: innerWidth, content: document.documentElement.scrollWidth }));
            if (v12Width.content > v12Width.width + 2) throw new Error('Demo overflows horizontally: ' + JSON.stringify(v12Width));
            await v12.setViewportSize({ width: 360, height: 780 });
            const v12Mobile = await v12.evaluate(() => ({ width: innerWidth, content: document.documentElement.scrollWidth }));
            if (v12Mobile.content > v12Mobile.width + 2) throw new Error('Overview overflows on mobile: ' + JSON.stringify(v12Mobile));
            await v12.getByRole('button', { name: 'History', exact: true }).click();
            const historyMobile = await v12.evaluate(() => ({ width: innerWidth, content: document.documentElement.scrollWidth }));
            if (historyMobile.content > historyMobile.width + 2) throw new Error('History overflows on mobile: ' + JSON.stringify(historyMobile));
            if (v12Errors.length) throw new Error('Guardian 1.2 demo page errors: ' + v12Errors.join(' | '));
            await v12.setViewportSize({ width: 1280, height: 900 });
            await v12.getByRole('button', { name: 'Overview', exact: true }).click();
            await v12.screenshot({ path: 'guardian-web-demo-1-2.png', fullPage: true });
            await v12.close();

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload demo screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guardian-interactive-demo
          path: |
            guardian-web-demo.png
            guardian-web-demo-mobile.png
            guardian-history-mobile.png
            guardian-web-demo-light.png
            guardian-settings-mobile.png
          if-no-files-found: warn
          retention-days: 7

      - name: Publish gh-pages branch
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the Flatpak update repository that release builds publish alongside the demo.
          if git clone --quiet --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/previous-pages; then
            for kept in repo guardian.flatpakrepo io.github.priceylewis.Guardian.flatpakref; do
              if [ -e "/tmp/previous-pages/$kept" ]; then cp -a "/tmp/previous-pages/$kept" dist/; fi
            done
          fi
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy Guardian interactive demo from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
