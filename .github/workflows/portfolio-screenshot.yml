name: Refresh portfolio screenshot

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "core/**"
      - "assets/themes/**"
      - "scripts/capture_portfolio_screenshot.py"
      - ".github/workflows/portfolio-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guardian-portfolio-screenshot
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
          python -m pip install -r requirements.txt

      - name: Capture real Guardian UI
        env:
          QT_QPA_PLATFORM: offscreen
          GUARDIAN_DATA_DIR: /tmp/guardian-portfolio-data
        run: python scripts/capture_portfolio_screenshot.py

      - name: Commit screenshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/guardian-overview.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: refresh Guardian UI screenshot [skip ci]"
          git pull --rebase origin main
          git push
